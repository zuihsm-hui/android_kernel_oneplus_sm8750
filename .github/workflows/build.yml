name: Build OnePlus 13 Kernel

on:
  workflow_dispatch:
    inputs:
      enable_fuse_passthrough:
        description: 'Enable FUSE Passthrough'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set Environment
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KERNEL_DIR=${{ github.workspace }}" >> $GITHUB_ENV
          echo "AK3_DIR=${{ github.workspace }}/anykernel3" >> $GITHUB_ENV

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/proton-clang
          key: proton-clang-r563880c

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          CLANG_DIR="${{ github.workspace }}/proton-clang"
          mkdir -p "$CLANG_DIR"
          curl -L "https://github.com/zuihsm-hui/android_kernel_oneplus_sm8750/releases/download/toolchain-v1/clang-r563880c.tar.gz" | tar xz -C "$CLANG_DIR"
          rm -f "$CLANG_DIR/bin/ld" "$CLANG_DIR/bin/ld.bfd" "$CLANG_DIR/bin/ld.gold" 2>/dev/null || true
          chmod +x "$CLANG_DIR/bin/"* 2>/dev/null || true

      - name: Verify Clang
        run: |
          echo "CLANG_BIN_DIR=${{ github.workspace }}/proton-clang/bin" >> $GITHUB_ENV
          "${{ github.workspace }}/proton-clang/bin/clang-21" --version

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib python3 libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3-pip flex libelf-dev

      - name: Auto-fix Missing Kconfig & Disable Missing Makefile Targets
        run: |
          cd ${{ env.KERNEL_DIR }}

          echo "=== 1. 为缺失的 Kconfig 文件创建占位（空文件） ==="
          find . -name "Kconfig" -type f | while read f; do
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^\s*source\s+"([^"]*)"'; then
                src=$(echo "$line" | sed -E 's/^\s*source\s+"([^"]*)".*/\1/')
                if [ ! -f "$src" ]; then
                  parent=$(dirname "$src" | xargs)   # 去除路径首尾可能存在的空白字符
                  # 如果 parent 存在且不是目录，则强制删除（可能是文件、符号链接等）
                  if [ -e "$parent" ] && [ ! -d "$parent" ]; then
                    rm -rf "$parent"
                    echo "  Removed non-directory to make way: $parent"
                  fi
                  # 安全创建目录（即使 parent 已作为目录存在也不会报错）
                  mkdir -p "$parent"
                  echo "# placeholder" > "$src"
                  echo "  Created placeholder Kconfig: $src"
                fi
              fi
            done < "$f"
          done

          echo "=== 2. 注释缺失的 Makefile obj- 目录引用 ==="
          find . -name "Makefile" -type f | while read f; do
            cp "$f" "$f.bak"
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^\s*obj-\w+\s*[+:]=\s*.*\/'; then
                dir_entry=$(echo "$line" | sed -E 's/^.*[+:]=\s*(.*)\/.*$/\1/' | xargs)
                if [ -n "$dir_entry" ] && [ ! -f "$dir_entry/Makefile" ]; then
                  echo "# [DISABLED] $line  (missing directory: $dir_entry)" >> "$f.new"
                else
                  echo "$line" >> "$f.new"
                fi
              else
                echo "$line" >> "$f.new"
              fi
            done < "$f.bak"
            if [ ! -f "$f.new" ]; then
              touch "$f.new"
            fi
            mv "$f.new" "$f"
            rm "$f.bak"
          done

          echo "=== 全部修复完成 ==="

      - name: Enable FUSE Passthrough (Config Modification)
        if: inputs.enable_fuse_passthrough
        run: |
          CONFIG_FILE="arch/arm64/configs/vendor/sun_consolidate.config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "CONFIG_FUSE_PASSTHROUGH=y" >> "$CONFIG_FILE"
            echo "FUSE Passthrough enabled in config"
          else
            echo "Error: $CONFIG_FILE not found"
            exit 1
          fi

      - name: Build Kernel
        env:
          PATH: "${{ env.CLANG_BIN_DIR }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        run: |
          cd ${{ env.KERNEL_DIR }}
          make clean || true
          make mrproper || true
          make vendor/sun_consolidate.config
          if [[ "${{ inputs.enable_fuse_passthrough }}" == "true" ]]; then
            grep -q "CONFIG_FUSE_PASSTHROUGH=y" .config || { echo "FUSE missing in .config"; exit 1; }
          fi
          make LLVM=1 -j$(nproc) Image.gz dtbs
          ls -lh arch/arm64/boot/Image.gz

      - name: Prepare AnyKernel3
        run: |
          test -d "${{ env.AK3_DIR }}/tools" || { echo "AK3 incomplete"; exit 1; }
          cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz ${{ env.AK3_DIR }}/Image.gz
          mkdir -p ${{ env.AK3_DIR }}/dtb
          find ${{ env.KERNEL_DIR }}/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtb" -exec cp {} ${{ env.AK3_DIR }}/dtb/ \; 2>/dev/null || true
          find ${{ env.KERNEL_DIR }}/arch/arm64/boot/dts/ -name "*.dtb" -maxdepth 3 -exec cp {} ${{ env.AK3_DIR }}/dtb/ \; 2>/dev/null || true
          test -f "${{ env.KERNEL_DIR }}/arch/arm64/boot/dtbo.img" && cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/dtbo.img ${{ env.AK3_DIR }}/dtbo.img || true

      - name: Package AnyKernel3
        run: |
          cd ${{ env.AK3_DIR }}
          zip -r9 ../AnyKernel3-OP5D0DL1.zip * -x ".git*" "*.md" "LICENSE" "README*" "*.sh~"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-OP5D0DL1
          path: AnyKernel3-OP5D0DL1.zip
          retention-days: 7