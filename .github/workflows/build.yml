name: Build OnePlus 13 Kernel

on:
  workflow_dispatch:
    inputs:
      enable_fuse_passthrough:
        description: Enable FUSE Passthrough
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Enable FUSE
        if: github.event.inputs.enable_fuse_passthrough == 'true'
        run: |
          CONFIG_FILE="arch/arm64/configs/vendor/sun_consolidate.config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "CONFIG_FUSE_PASSTHROUGH=y" >> "$CONFIG_FILE"
          else
            echo "Config not found"
            exit 1
          fi

      - name: Set Env
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KERNEL_DIR=${{ github.workspace }}" >> $GITHUB_ENV
          echo "AK3_DIR=${{ github.workspace }}/anykernel3" >> $GITHUB_ENV

      - name: Cache Clang
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/proton-clang
          key: clang-r563880c-v1

      - name: Download Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'        run: |
          mkdir -p ${{ github.workspace }}/proton-clang
          curl -L "https://github.com/zuihsm-hui/android_kernel_oneplus_sm8750/releases/download/toolchain-v1/clang-r563880c.tar.gz" | tar xz -C ${{ github.workspace }}/proton-clang
          rm -f ${{ github.workspace }}/proton-clang/bin/ld* 2>/dev/null || true
          chmod +x ${{ github.workspace }}/proton-clang/bin/* 2>/dev/null || true

      - name: Setup Clang
        run: |
          echo "CLANG_BIN_DIR=${{ github.workspace }}/proton-clang/bin" >> $GITHUB_ENV
          ${{ github.workspace }}/proton-clang/bin/clang-21 --version

      - name: Install Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib python3 libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3-pip flex libelf-dev

      - name: Build Kernel
        env:
          PATH: "${{ env.CLANG_BIN_DIR }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          CC: clang
          LD: ld.lld
          AR: llvm-ar
          NM: llvm-nm
          STRIP: llvm-strip
          OBJCOPY: llvm-objcopy
          HOSTCC: clang
          HOSTCXX: clang++
          HOSTLD: ld.lld
          HOSTAR: llvm-ar
          KCFLAGS: "-Wno-error=unused-but-set-variable -Wno-error=unused-function -Wno-error=deprecated-declarations"
        run: |
          cd ${{ env.KERNEL_DIR }}
          make clean || true
          make mrproper || true
          rm -rf drivers/base/kernelFwUpdate drivers/base/touchpanel_notify drivers/base/magtransfer drivers/misc/vibrator/haptic_feedback
          mkdir -p drivers/base/kernelFwUpdate drivers/base/touchpanel_notify drivers/base/magtransfer drivers/misc/vibrator/haptic_feedback
          echo 'menuconfig DUMMY1' > drivers/base/kernelFwUpdate/Kconfig
          echo '  bool "Dummy"' >> drivers/base/kernelFwUpdate/Kconfig
          echo '  default n' >> drivers/base/kernelFwUpdate/Kconfig
          touch drivers/base/kernelFwUpdate/Makefile
          echo 'menuconfig DUMMY2' > drivers/base/touchpanel_notify/Kconfig
          echo '  bool "Dummy"' >> drivers/base/touchpanel_notify/Kconfig
          echo '  default n' >> drivers/base/touchpanel_notify/Kconfig
          touch drivers/base/touchpanel_notify/Makefile
          echo 'menuconfig DUMMY3' > drivers/base/magtransfer/Kconfig
          echo '  bool "Dummy"' >> drivers/base/magtransfer/Kconfig
          echo '  default n' >> drivers/base/magtransfer/Kconfig
          touch drivers/base/magtransfer/Makefile
          echo 'menuconfig DUMMY4' > drivers/misc/vibrator/haptic_feedback/Kconfig
          echo '  bool "Dummy"' >> drivers/misc/vibrator/haptic_feedback/Kconfig          echo '  default n' >> drivers/misc/vibrator/haptic_feedback/Kconfig
          touch drivers/misc/vibrator/haptic_feedback/Makefile
          make vendor/sun_consolidate.config
          grep -q "CONFIG_FUSE_PASSTHROUGH=y" .config || { echo "FUSE missing"; exit 1; }
          make -j$(nproc) Image.gz dtbs
          ls -lh arch/arm64/boot/Image.gz

      - name: Prepare AK3
        run: |
          test -d "${{ env.AK3_DIR }}/tools" || { echo "AK3 incomplete"; exit 1; }
          cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz ${{ env.AK3_DIR }}/Image.gz
          mkdir -p ${{ env.AK3_DIR }}/dtb
          find ${{ env.KERNEL_DIR }}/arch/arm64/boot/dts/vendor/qcom/ -name "*.dtb" -exec cp {} ${{ env.AK3_DIR }}/dtb/ \; 2>/dev/null || true
          find ${{ env.KERNEL_DIR }}/arch/arm64/boot/dts/ -name "*.dtb" -maxdepth 3 -exec cp {} ${{ env.AK3_DIR }}/dtb/ \; 2>/dev/null || true
          test -f "${{ env.KERNEL_DIR }}/arch/arm64/boot/dtbo.img" && cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/dtbo.img ${{ env.AK3_DIR }}/dtbo.img || true

      - name: Package AK3
        run: |
          cd ${{ env.AK3_DIR }}
          zip -r9 ../AnyKernel3-OP5D0DL1.zip * -x ".git*" "*.md" "LICENSE" "README*" "*.sh~"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-OP5D0DL1
          path: AnyKernel3-OP5D0DL1.zip
          retention-days: 7