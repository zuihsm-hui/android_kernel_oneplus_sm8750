name: Build OnePlus 13 Kernel with FUSE Passthrough

on:
  workflow_dispatch:
    inputs:
      enable_fuse_passthrough:
        description: '启用 FUSE Passthrough 直通'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4

      - name: 开启 FUSE Passthrough (可选)
        if: ${{ github.event.inputs.enable_fuse_passthrough == 'true' }}
        run: |
          echo "CONFIG_FUSE_PASSTHROUGH=y" >> arch/arm64/configs/vendor/sun_consolidate.config

      - name: 编译内核
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/${{ github.repository }}
          kernel-branch: ${{ github.ref_name }}
          kernel-dir: .                          # 使用当前已检出的源码，而非重新克隆
          config: sun_consolidate.config
          arch: arm64
          other-clang-url: "https://github.com/zuihsm-hui/android_kernel_oneplus_sm8750/releases/download/toolchain-v1/clang-r563880c.tar.gz"
          # 如需 KernelSU 则取消下一行注释
          # ksu: true