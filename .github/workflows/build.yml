- name: Try to apply FUSE Passthrough patches
  id: apply_patches
  run: |
    cd ${{ env.KERNEL_DIR }}
    # 清理可能残留的 am 状态
    git am --abort 2>/dev/null || true
    git reset --hard HEAD

    if grep -q "config FUSE_PASSTHROUGH" fs/fuse/Kconfig 2>/dev/null; then
      echo "FUSE Passthrough patches already applied."
      echo "FUSE_PASSTHROUGH_APPLIED=yes" >> $GITHUB_OUTPUT
      exit 0
    fi

    echo "Attempting to apply patches from patches/fuse-passthrough..."
    set +e
    git -c user.email="actions@github.com" -c user.name="GitHub Actions" am patches/fuse-passthrough/*.patch 2>&1 | tee /tmp/am_log.txt
    if [ ${PIPESTATUS[0]} -ne 0 ]; then
      echo "Patch application failed. Aborting and cleaning up."
      git am --abort 2>/dev/null || true
      echo "FUSE_PASSTHROUGH_APPLIED=no" >> $GITHUB_OUTPUT
    else
      echo "Patches applied successfully."
      echo "FUSE_PASSTHROUGH_APPLIED=yes" >> $GITHUB_OUTPUT
    fi
    set -e