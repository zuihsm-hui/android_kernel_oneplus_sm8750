name: Build OnePlus 13 Kernel with FUSE Passthrough & AnyKernel3

on:
  workflow_dispatch:
    inputs:
      enable_fuse_passthrough:
        description: '启用 FUSE Passthrough 直通'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: 检出本地仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: 开启 FUSE Passthrough (可选)
        if: ${{ github.event.inputs.enable_fuse_passthrough == 'true' }}
        run: |
          CONFIG_FILE="arch/arm64/configs/vendor/sun_consolidate.config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "CONFIG_FUSE_PASSTHROUGH=y" >> "$CONFIG_FILE"
            echo "✅ 已启用 CONFIG_FUSE_PASSTHROUGH"
          else
            echo "❌ 配置文件未找到: $CONFIG_FILE"
            exit 1
          fi

      - name: 设置环境变量
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "KERNEL_DIR=${{ github.workspace }}" >> $GITHUB_ENV
          echo "AK3_DIR=${{ github.workspace }}/anykernel3" >> $GITHUB_ENV

      - name: 下载并配置 Proton Clang
        run: |
          CLANG_ROOT="${{ github.workspace }}/proton-clang"
          mkdir -p "$CLANG_ROOT"
          echo "📥 下载 Proton Clang r563880c..."
          curl -L "https://github.com/zuihsm-hui/android_kernel_oneplus_sm8750/releases/download/toolchain-v1/clang-r563880c.tar.gz" | tar xz -C "$CLANG_ROOT"
          rm -f "$CLANG_ROOT/bin/ld" "$CLANG_ROOT/bin/ld.bfd" "$CLANG_ROOT/bin/ld.gold" 2>/dev/null || true
          echo "CLANG_BIN_DIR=$CLANG_ROOT/bin" >> $GITHUB_ENV          export PATH="$CLANG_ROOT/bin:$PATH"
          echo "✅ 验证 Clang 版本..."
          clang-21 --version

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib python3 libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3-pip flex libelf-dev

      - name: 编译内核
        env:
          PATH: "${{ env.CLANG_BIN_DIR }}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          CC: clang
          LD: ld.lld
          AR: llvm-ar
          NM: llvm-nm
          STRIP: llvm-strip
          OBJCOPY: llvm-objcopy
          HOSTCC: clang
          HOSTCXX: clang++
          HOSTLD: ld.lld
          HOSTAR: llvm-ar
          KCFLAGS: "-Wno-error=unused-but-set-variable -Wno-error=unused-function -Wno-error=deprecated-declarations"
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "🧹 清理旧构建..."
          make clean || true
          make mrproper || true
          echo "⚙️ 加载配置: sun_consolidate.config"
          make sun_consolidate.config
          echo "🔎 验证 FUSE Passthrough 配置..."
          if grep -q "CONFIG_FUSE_PASSTHROUGH=y" .config; then
            echo "✅ CONFIG_FUSE_PASSTHROUGH 已启用"
          else
            echo "❌ CONFIG_FUSE_PASSTHROUGH 未找到"
            exit 1
          fi
          echo "🚀 开始编译 (使用 $(nproc) 线程)..."
          make -j$(nproc) Image.gz dtbs
          echo "✅ 内核编译完成!"
          ls -lh arch/arm64/boot/Image.gz

      - name: 准备 AnyKernel3 打包
        run: |
          if [ ! -d "${{ env.AK3_DIR }}/tools" ]; then
            echo "❌ 错误: anykernel3 目录不完整!"
            ls -la "${{ env.AK3_DIR }}/" 2>/dev/null || echo "目录不存在"
            exit 1
          fi
          echo "📋 复制 Image.gz..."          cp ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image.gz ${{ env.AK3_DIR }}/Image.gz
          echo "📋 复制 DTB 文件..."
          mkdir -p ${{ env.AK3_DIR }}/dtb
          DTB_PATH="${{ env.KERNEL_DIR }}/arch/arm64/boot/dts/vendor/qcom"
          if [ -d "$DTB_PATH" ]; then
            find "$DTB_PATH" -name "*.dtb" -exec cp {} ${{ env.AK3_DIR }}/dtb/ \;
            echo "✅ 已复制 $(find ${{ env.AK3_DIR }}/dtb -name '*.dtb' | wc -l) 个 DTB 文件"
          else
            echo